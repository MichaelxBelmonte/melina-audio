name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/update_ecosystem_graph.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Refresh ecosystem metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update_ecosystem_graph.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload landing page
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
